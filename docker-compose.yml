services:
  mysql:
    image: mysql:8.0
    container_name: tk3c_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: tk3c_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Taipei
    command: --default-time-zone='+08:00'
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # init.sql 只在資料庫第一次建立時需要；單檔掛載在 Docker Desktop 重開後常失效，導致 MySQL 起不來
      # 若要從空的 volume 重建資料庫，再暫時把下一行打開
      # - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: tk3c_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - mysql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: tk3c_rabbitmq
    restart: unless-stopped
    ports:
      # 5672 不對外開放：容器之間走內部網路即可，且這個 port 常被 Windows 保留導致整個 service 的 port 開不了
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  flower:
    image: mher/flower:2.0
    container_name: tk3c_flower
    restart: unless-stopped
    command: celery --broker=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672// flower
    environment:
      TZ: Asia/Taipei
    ports:
      - "5555:5555"
    depends_on:
      rabbitmq:
        condition: service_healthy

  api:
    build: .
    container_name: tk3c_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      TZ: Asia/Taipei
    ports:
      - "8001:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app

  celery-worker:
    build: .
    container_name: tk3c_celery_worker
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info -E
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      RABBITMQ_HOST: rabbitmq
      TZ: Asia/Taipei
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app

  celery-beat:
    build: .
    container_name: tk3c_celery_beat
    restart: unless-stopped
    command: celery -A app.celery_app beat --loglevel=info --schedule=/app/celerybeat-data/celerybeat-schedule
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      RABBITMQ_HOST: rabbitmq
      TZ: Asia/Taipei
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      celery-worker:
        condition: service_started
    volumes:
      - .:/app
      - celerybeat_data:/app/celerybeat-data

volumes:
  mysql_data:
  celerybeat_data: