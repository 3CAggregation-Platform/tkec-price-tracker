schema: tk3c_price_tracker
sql: "SELECT t.*,\n      CASE WHEN t.\u6293\u53D6\u65E5\u671F = (SELECT MAX(\u6293\
  \u53D6\u65E5\u671F) FROM all_goods_daily WHERE \u5E73\u53F0 = 'tk3c') THEN 1 ELSE\
  \ 0 END AS \u662F\u5426\u6700\u65B0,\n       CASE \n         WHEN t.\u50F9\u5DEE\
  \ = 0 THEN '\u540C\u50F9'\n         WHEN t.\u71E6\u5764 THEN '\u71E6\u5764'\n  \
  \       WHEN t.PChome THEN 'PChome'\n         WHEN t.Yahoo THEN 'Yahoo'\n      \
  \   WHEN t.momo THEN 'momo'\n       END AS \u6700\u4FBF\u5B9C\u5E73\u53F0\nFROM\
  \ (\n  SELECT \u6293\u53D6\u65E5\u671F, \u5206\u985E, \u578B\u865F,\n         MIN(CASE\
  \ WHEN \u5E73\u53F0 = 'tk3c'   THEN \u552E\u50F9 END) AS \u71E6\u5764,\n       \
  \  MIN(CASE WHEN \u5E73\u53F0 = 'pchome' THEN \u552E\u50F9 END) AS PChome,\n   \
  \      MIN(CASE WHEN \u5E73\u53F0 = 'yahoo'  THEN \u552E\u50F9 END) AS Yahoo,\n\
  \         MIN(CASE WHEN \u5E73\u53F0 = 'momo'   THEN \u552E\u50F9 END) AS momo,\n\
  \         MIN(\u552E\u50F9) AS \u6700\u4F4E\u50F9,\n         MAX(\u552E\u50F9) -\
  \ MIN(\u552E\u50F9) AS \u50F9\u5DEE,\n         COUNT(DISTINCT \u5E73\u53F0) AS \u5E73\
  \u53F0\u6578\n  FROM all_goods_daily\n  WHERE \u578B\u865F IS NOT NULL AND \u578B\
  \u865F <> ''\n  GROUP BY \u6293\u53D6\u65E5\u671F, \u5206\u985E, \u578B\u865F\n\
  \  HAVING COUNT(DISTINCT \u5E73\u53F0) >= 2\n) t\nORDER BY t.\u6293\u53D6\u65E5\u671F\
  \ DESC, t.\u50F9\u5DEE DESC"
