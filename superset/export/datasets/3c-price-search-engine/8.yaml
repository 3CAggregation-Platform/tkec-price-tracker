sql: "SELECT \u5206\u985E, \u578B\u865F,\n       MAX(\u5EE0\u724C) AS \u5EE0\u724C\
  ,\n       MIN(CASE WHEN \u5E73\u53F0 = 'tk3c'   THEN \u552E\u50F9 END) AS \u71E6\
  \u5764,\n       MIN(CASE WHEN \u5E73\u53F0 = 'pchome' THEN \u552E\u50F9 END) AS\
  \ PChome,\n       MIN(CASE WHEN \u5E73\u53F0 = 'yahoo'  THEN \u552E\u50F9 END) AS\
  \ Yahoo,\n       COUNT(*) AS \u5E73\u53F0\u6578,\n       MIN(\u552E\u50F9) AS \u6700\
  \u4F4E\u50F9,\n       MAX(\u552E\u50F9) - MIN(\u552E\u50F9) AS \u50F9\u5DEE,\n \
  \      ROUND((MAX(\u552E\u50F9) - MIN(\u552E\u50F9)) / MIN(\u552E\u50F9), 3) AS\
  \ \u50F9\u5DEE\u6BD4\u4F8B,\n       CASE WHEN MAX(\u552E\u50F9) = MIN(\u552E\u50F9\
  ) THEN '\u540C\u50F9'\n            ELSE GROUP_CONCAT(CASE WHEN \u552E\u50F9 = \u6700\
  \u4F4E THEN \u5E73\u53F0\u540D\u7A31 END\n                              ORDER BY\
  \ FIELD(\u5E73\u53F0, 'tk3c', 'pchome', 'yahoo') SEPARATOR '\u3001')\n       END\
  \ AS \u6700\u4FBF\u5B9C\u5E73\u53F0\nFROM (\n  SELECT \u5206\u985E, \u578B\u865F\
  , \u5EE0\u724C, \u5E73\u53F0, \u552E\u50F9,\n         ELT(FIELD(\u5E73\u53F0, 'tk3c',\
  \ 'pchome', 'yahoo'), '\u71E6\u5764', 'PChome', 'Yahoo') AS \u5E73\u53F0\u540D\u7A31\
  ,\n         MIN(\u552E\u50F9) OVER (PARTITION BY \u5206\u985E, \u578B\u865F) AS\
  \ \u6700\u4F4E\n  FROM watch_price_daily\n  WHERE \u6293\u53D6\u65E5\u671F = (SELECT\
  \ MAX(\u6293\u53D6\u65E5\u671F) FROM watch_price_daily)\n) w\nGROUP BY \u5206\u985E\
  , \u578B\u865F\nHAVING COUNT(*) >= 2"
