schema: tk3c_price_tracker
sql: "SELECT \u5E73\u53F0, \u6293\u53D6\u65E5\u671F, \u5206\u985E, \u5EE0\u724C, \u578B\
  \u865F, \u5546\u54C1\u540D\u7A31, \u552E\u50F9, \u9023\u7D50,\n  CASE \u5206\u985E\
  \ WHEN '\u6D17\u8863\u6A5F' THEN CAST(REGEXP_SUBSTR(\u5546\u54C1\u540D\u7A31, '(?<![A-Za-z0-9.])(?<![A-Za-z0-9]-)[0-9]+([.][0-9]+)?(?=[[:space:]]*(\u516C\
  \u65A4|kg))', 1, 1, 'i') AS DECIMAL(6,1)) WHEN '\u96FB\u8996' THEN CAST(REGEXP_SUBSTR(\u5546\
  \u54C1\u540D\u7A31, '[0-9]{2,3}(?=[[:space:]]*(\u540B|\u578B))', 1, 1, 'c') AS DECIMAL(6,1))\
  \ ELSE CAST(REGEXP_SUBSTR(\u5546\u54C1\u540D\u7A31, '(?<![A-Za-z0-9.])(?<![A-Za-z0-9]-)[0-9]+([.][0-9]+)?(?=[[:space:]]*(\u516C\
  \u5347|L))', 1, 1, 'c') AS DECIMAL(6,1)) END AS \u898F\u683C,\n  CASE \u5206\u985E\
  \ WHEN '\u6D17\u8863\u6A5F' THEN 'kg' WHEN '\u96FB\u8996' THEN '\u540B' ELSE 'L'\
  \ END AS \u55AE\u4F4D,\n  CASE\n    WHEN \u5206\u985E = '\u6D17\u8863\u6A5F' THEN\n\
  \      CASE WHEN \u5546\u54C1\u540D\u7A31 LIKE '%\u96D9\u69FD%' THEN '\u96D9\u69FD\
  '\n           WHEN \u5546\u54C1\u540D\u7A31 LIKE '%\u6EFE\u7B52%' THEN '\u6EFE\u7B52\
  '\n           ELSE '\u76F4\u7ACB' END\n    WHEN \u5206\u985E = '\u51B0\u7BB1' THEN\n\
  \      CASE WHEN \u5546\u54C1\u540D\u7A31 LIKE '%\u884C\u52D5%' THEN '\u884C\u52D5\
  \u51B0\u7BB1'\n           WHEN \u5546\u54C1\u540D\u7A31 LIKE '%\u5C0D\u958B%' THEN\
  \ '\u5C0D\u958B'\n           WHEN \u5546\u54C1\u540D\u7A31 REGEXP '\u56DB\u9580\
  |\u4E94\u9580|\u516D\u9580' THEN '\u56DB\u9580\u4EE5\u4E0A'\n           WHEN \u5546\
  \u54C1\u540D\u7A31 LIKE '%\u4E09\u9580%' THEN '\u4E09\u9580'\n           WHEN \u5546\
  \u54C1\u540D\u7A31 REGEXP '\u96D9\u9580|\u5169\u9580|\u4E0A\u4E0B\u9580|\u4E0B\u51B7\
  \u51CD|\u4E0A\u51B7\u85CF' THEN '\u96D9\u9580'\n           WHEN \u5546\u54C1\u540D\
  \u7A31 LIKE '%\u55AE\u9580%' THEN '\u55AE\u9580'\n           ELSE '\u5176\u4ED6\
  ' END\n    WHEN \u5206\u985E = '\u6C23\u70B8\u934B' THEN\n      CASE WHEN \u5546\
  \u54C1\u540D\u7A31 REGEXP '\u96D9\u5C64|\u96D9\u934B|\u96D9\u4EAB|[0-9]L[+]' THEN\
  \ '\u96D9\u934B'\n           WHEN \u5546\u54C1\u540D\u7A31 LIKE '%\u84B8\u6C23%'\
  \ THEN '\u84B8\u6C23'\n           WHEN \u5546\u54C1\u540D\u7A31 REGEXP '\u900F\u8996\
  |\u73BB\u7483' THEN '\u900F\u8996'\n           ELSE '\u4E00\u822C' END\n    WHEN\
  \ \u5206\u985E = '\u96FB\u8996' THEN\n      CASE WHEN \u5546\u54C1\u540D\u7A31 REGEXP\
  \ '(?i)oled' THEN 'OLED'\n           WHEN \u5546\u54C1\u540D\u7A31 REGEXP '(?i)mini[\
  \ -]?led' THEN 'Mini LED'\n           WHEN \u5546\u54C1\u540D\u7A31 REGEXP '(?i)qled|\u91CF\
  \u5B50' THEN 'QLED'\n           ELSE 'LED' END\n    WHEN \u5206\u985E = '\u6383\u5730\
  \u6A5F\u5668\u4EBA' THEN\n      CASE WHEN \u5546\u54C1\u540D\u7A31 LIKE '%\u6EFE\
  \u7B52%' THEN '\u6EFE\u7B52\u6D17\u5730'\n           WHEN \u5546\u54C1\u540D\u7A31\
  \ LIKE '%\u6A5F\u68B0\u81C2%' THEN '\u6A5F\u68B0\u81C2'\n           WHEN \u5546\u54C1\
  \u540D\u7A31 REGEXP '(?i)\u5168\u80FD|\u57FA\u7AD9|\u81EA\u6E05\u6F54|\u6D17\u70D8\
  |\u81EA\u52D5\u6D17|ultra|omni|edge|saros|curv' THEN '\u5168\u80FD\u57FA\u7AD9'\n\
  \           WHEN \u5546\u54C1\u540D\u7A31 REGEXP '\u6383\u62D6|\u6FD5\u62D6|\u62D6\
  \u5730' THEN '\u6383\u62D6'\n           ELSE '\u57FA\u672C\u6383\u5730' END\n  END\
  \ AS \u985E\u578B,\n  (\u5546\u54C1\u540D\u7A31 LIKE '%\u70D8%') AS \u6709\u70D8\
  \u4E7E,\n  ROUND(\u552E\u50F9 / CASE \u5206\u985E WHEN '\u6D17\u8863\u6A5F' THEN\
  \ CAST(REGEXP_SUBSTR(\u5546\u54C1\u540D\u7A31, '(?<![A-Za-z0-9.])(?<![A-Za-z0-9]-)[0-9]+([.][0-9]+)?(?=[[:space:]]*(\u516C\
  \u65A4|kg))', 1, 1, 'i') AS DECIMAL(6,1)) WHEN '\u96FB\u8996' THEN CAST(REGEXP_SUBSTR(\u5546\
  \u54C1\u540D\u7A31, '[0-9]{2,3}(?=[[:space:]]*(\u540B|\u578B))', 1, 1, 'c') AS DECIMAL(6,1))\
  \ ELSE CAST(REGEXP_SUBSTR(\u5546\u54C1\u540D\u7A31, '(?<![A-Za-z0-9.])(?<![A-Za-z0-9]-)[0-9]+([.][0-9]+)?(?=[[:space:]]*(\u516C\
  \u5347|L))', 1, 1, 'c') AS DECIMAL(6,1)) END) AS \u6BCF\u55AE\u4F4D\u50F9,\n  CASE\
  \ WHEN \u6293\u53D6\u65E5\u671F = MAX(\u6293\u53D6\u65E5\u671F) OVER (PARTITION\
  \ BY \u5E73\u53F0, \u5206\u985E) THEN 1 ELSE 0 END AS \u662F\u5426\u6700\u65B0\n\
  FROM all_goods_daily\nWHERE \u5206\u985E IN ('\u6D17\u8863\u6A5F', '\u51B0\u7BB1\
  ', '\u6C23\u70B8\u934B', '\u96FB\u8996', '\u6383\u5730\u6A5F\u5668\u4EBA')"
