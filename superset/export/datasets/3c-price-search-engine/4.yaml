sql: "SELECT CASE \u5E73\u53F0 WHEN 'tk3c' THEN '\u71E6\u5764' WHEN 'pchome' THEN\
  \ 'PChome' WHEN 'yahoo' THEN 'Yahoo' ELSE 'momo' END AS \u5E73\u53F0\u540D\u7A31\
  ,\n       \u5206\u985E, ANY_VALUE(\u578B\u865F) AS \u578B\u865F, ANY_VALUE(\u5546\
  \u54C1\u540D\u7A31) AS \u5546\u54C1\u540D\u7A31,\n       COUNT(*) AS \u89C0\u5BDF\
  \u5929\u6578,\n       MIN(\u6293\u53D6\u65E5\u671F) AS \u9996\u6B21\u51FA\u73FE\
  , MAX(\u6293\u53D6\u65E5\u671F) AS \u6700\u8FD1\u51FA\u73FE,\n       SUM(\u552E\u50F9\
  \ <> \u524D\u6B21\u552E\u50F9) AS \u8B8A\u50F9\u6B21\u6578,\n       MIN(\u552E\u50F9\
  ) AS \u6700\u4F4E\u50F9, MAX(\u552E\u50F9) AS \u6700\u9AD8\u50F9,\n       ROUND((MAX(\u552E\
  \u50F9) - MIN(\u552E\u50F9)) / MAX(\u552E\u50F9), 3) AS \u6CE2\u52D5\u5E45\u5EA6\
  \nFROM (\n  SELECT \u5E73\u53F0, \u5206\u985E, \u5546\u54C1\u7DE8\u865F, \u578B\u865F\
  , \u5546\u54C1\u540D\u7A31, \u6293\u53D6\u65E5\u671F, \u552E\u50F9,\n         LAG(\u552E\
  \u50F9) OVER (PARTITION BY \u5E73\u53F0, \u5546\u54C1\u7DE8\u865F ORDER BY \u6293\
  \u53D6\u65E5\u671F) AS \u524D\u6B21\u552E\u50F9\n  FROM all_goods_daily\n) h\nGROUP\
  \ BY \u5E73\u53F0, \u5206\u985E, \u5546\u54C1\u7DE8\u865F\nHAVING COUNT(*) >= 7\n\
  ORDER BY \u8B8A\u50F9\u6B21\u6578 DESC, \u6CE2\u52D5\u5E45\u5EA6 DESC"
